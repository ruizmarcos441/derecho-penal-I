<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derecho Penal I</title>
<style>
:root{--azul:#123b63;--azul2:#1b568b;--dorado:#c9a227;--texto:#1f2937;--gris:#667085;--verde:#198754;--amarillo:#fff8df;--rojo:#9f2d2d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eef3f8 0,#f7f8fa 100%);font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
.header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border-bottom:5px solid var(--dorado)}
.header-inner{max-width:980px;margin:auto;padding:28px 22px}
.brand{font-size:30px;font-weight:800;letter-spacing:.2px}
.subtitle{margin-top:6px;opacity:.9;font-size:15px}
.container{max-width:980px;margin:28px auto;padding:0 18px}
.card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(18,59,99,.10);border:1px solid #e6eaf0;margin-bottom:20px}
h1,h2,h3{color:var(--azul);margin-top:0}
h2{font-size:21px}
label{display:block;font-weight:700;color:#344054;margin-bottom:5px}
input,textarea,select{width:100%;padding:13px 14px;border:1px solid #cfd6df;border-radius:9px;background:#fff;font:inherit;margin:0 0 16px}
input:focus,textarea:focus{outline:3px solid rgba(27,86,139,.13);border-color:var(--azul2)}
button,.btn{border:0;border-radius:9px;padding:12px 17px;background:var(--azul);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(.95)}
.btn-gold{background:var(--dorado);color:#17202a}.btn-green{background:var(--verde)}.btn-red{background:var(--rojo)}
.muted{color:var(--gris)}
.flash{background:#fff5cf;border:1px solid #ecd477;color:#5c4a08;border-radius:10px;padding:13px 15px;margin-bottom:18px}
.student-head{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.student-code{font-size:14px;color:var(--gris);margin-top:4px}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 0}
.tab{border:1px solid #cbd5e1;background:#f8fafc;color:var(--azul);padding:11px 15px;border-radius:9px;font-weight:700;cursor:pointer}
.tab.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.exam-panel{display:none}.exam-panel.active{display:block}
.grade-box{text-align:center;background:linear-gradient(180deg,#f7fbff,#fff);border:1px solid #dce7f1;border-radius:15px;padding:25px;margin:18px 0}
.grade{font-size:56px;line-height:1;color:var(--verde);font-weight:800}
.grade-label{margin-top:9px;color:var(--gris);font-size:14px}
.prevention{background:var(--amarillo);border-left:5px solid var(--dorado);padding:17px;border-radius:10px;margin:18px 0}
.appeal{border:1px solid #e2e6eb;border-radius:14px;padding:20px;background:#fff}
.appeal-title{color:var(--azul);font-weight:800;font-size:19px;margin-bottom:10px}
.notice{background:#edf7ef;border:1px solid #b9ddc0;color:#216b2e;padding:15px;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.teacher-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.appeal-item{border:1px solid #e1e5ea;border-radius:12px;padding:16px;margin-bottom:13px;background:#fafbfc}
.status{font-weight:800}.pending{color:#9a6700}.resolved{color:var(--verde)}
.footer{text-align:center;color:#7a8592;font-size:13px;padding:8px 0 30px}
@media(max-width:650px){.container{padding:0 12px}.card{padding:19px}.brand{font-size:24px}.row{grid-template-columns:1fr}.grade{font-size:48px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand">⚖️ Derecho Penal I</div><div class="subtitle">Consulta de resultados académicos</div></div></header>
<div class="container">
{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
{% block content %}{% endblock %}
<div class="footer">Derecho Penal I · Sistema de resultados académicos</div>
</div>
</body>
</html>
