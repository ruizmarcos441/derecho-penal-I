<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derecho Penal I</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:900px;margin:35px auto;padding:20px}.card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 18px #0001;margin-bottom:20px}.muted{color:#65727e}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #ccd3da;border-radius:8px;box-sizing:border-box}input,textarea,select{width:100%;margin:7px 0 14px}button{cursor:pointer;background:#17202a;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:10px 14px;border:1px solid #ccd3da;border-radius:8px;background:#fff}.grade{font-size:42px;font-weight:bold}.flash{padding:12px;background:#fff7d6;border-radius:8px;margin-bottom:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap">{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</div></body></html>
